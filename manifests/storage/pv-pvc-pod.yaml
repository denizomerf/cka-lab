# Static provisioning: a hostPath PV bound to a PVC through a matching
# storageClassName, size and access mode, then mounted into a pod.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-log
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/log
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: logger
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: log-pvc
  containers:
    - name: logger
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/out.log; sleep 10; done"]
      volumeMounts:
        - name: data
          mountPath: /data
